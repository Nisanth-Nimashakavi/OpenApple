[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapple"
version = "0.4.0"
description = "Human-verified reinforcement protocol for LLMs — the benevolent opposite of OpenWhip."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "OpenApple Community" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "antigravity",
    "codex",
    "reinforcement-learning",
    "ai-agent",
    "openwhip"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.30,<2",
    "anyio>=4.6,<5",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
    "setuptools>=77,<85",
    "wheel>=0.45,<1",
]

[project.scripts]
openapple-cli = "openapple.cli:main"
openapple-server = "openapple.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["openapple*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
