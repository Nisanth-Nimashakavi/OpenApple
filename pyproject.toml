[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapple"
version = "0.3.0"
description = "Human-verified reinforcement protocol for LLMs — the benevolent opposite of OpenWhip."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenApple Community" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "antigravity",
    "codex",
    "reinforcement-learning",
    "ai-agent",
    "openwhip"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "rich",
    "typer",
]

[project.scripts]
openapple = "openapple.cli:main"
openapple-server = "openapple.server:run_server"
openapple-gui = "openapple.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["openapple*"]
