name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      OPENAPPLE_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci
      - run: python -m ruff check openapple tests
      - run: python -m ruff format --check openapple tests
      - run: python -m mypy openapple
      - run: python -m pytest -q
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run test:desktop
        if: runner.os == 'Linux' && matrix.python == '3.13'
      - run: python -m build --no-isolation
      - run: npm pack
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: distributions
          path: |
            dist/*
            lordnimnim-openapple-*.tgz
