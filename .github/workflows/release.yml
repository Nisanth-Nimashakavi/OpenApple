name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci
      - run: python -m pytest -q
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: python -m ruff check openapple tests
      - run: python -m ruff format --check openapple tests
      - run: python -m mypy openapple
      - run: npm run test:desktop
      - run: python -m build --no-isolation
      - run: npm pack
      - run: python scripts/check_artifacts.py
      - run: python scripts/check_installation.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapple-release
          path: |
            dist/*
            lordnimnim-openapple-*.tgz
